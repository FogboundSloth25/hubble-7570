name: Build Hubble 7570 Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/hubble-android-source.zip"
      - "android/apply-usbfs-transition.py"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/hubble-android-source.zip"
      - "android/apply-usbfs-transition.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        run: |
          mkdir -p build-src
          unzip -q android/hubble-android-source.zip -d build-src
          test -f build-src/hubble-android/app/src/main/java/com/validity/hubble7570/MainActivity.java
          test -f build-src/hubble-android/usbhost/main.go

      - name: Apply USBFS transfer and transition fixes
        run: python3 android/apply-usbfs-transition.py build-src/hubble-android

      - name: Export extracted Android source for debugging
        uses: actions/upload-artifact@v4
        with:
          name: Hubble7570-Android-source-debug
          path: build-src/hubble-android
          retention-days: 1

      - name: Build Android ARM64 USBFS helper
        working-directory: build-src/hubble-android
        run: |
          mkdir -p app/src/main/assets
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build \
            -trimpath -ldflags="-s -w" \
            -o app/src/main/assets/hubbleusb-arm64 usbhost/main.go
          file app/src/main/assets/hubbleusb-arm64

      - name: Assemble debug APK
        working-directory: build-src/hubble-android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and calculate checksum
        working-directory: build-src/hubble-android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hubble7570-Android-debug-APK
          path: |
            build-src/hubble-android/app/build/outputs/apk/debug/app-debug.apk
            build-src/hubble-android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
